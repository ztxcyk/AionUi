name: '🔨 Manual Build'

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
          - all
        default: 'macos-arm64'
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        required: false
        type: boolean
        default: false
      aioncore_run_id:
        description: 'Optional AionCore Manual Build workflow run id to bundle instead of the pinned release'
        required: false
        type: string
        default: ''

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      release_info: ${{ steps.set-matrix.outputs.release_info }}
      build_ref: ${{ steps.pin-ref.outputs.build_ref || inputs.branch }}

    steps:
      - name: Checkout workflow code
        uses: actions/checkout@v6

      - name: Checkout selected Windows build ref
        if: inputs.platform == 'all' || startsWith(inputs.platform, 'windows-')
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          path: target-ref

      - name: Pin Windows build ref
        if: inputs.platform == 'all' || startsWith(inputs.platform, 'windows-')
        id: pin-ref
        run: |
          workflow_commit=$(git rev-parse HEAD)
          target_commit=$(git -C target-ref rev-parse HEAD)
          if [ "$workflow_commit" != "$target_commit" ]; then
            echo "::error::Windows builds require the workflow ref and selected branch to be the same commit."
            echo "::error::Run this workflow from the branch you intend to build."
            exit 1
          fi
          echo "build_ref=$target_commit" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate build matrix
        id: set-matrix
        run: node scripts/prepareOfficeCliMatrix.js
        env:
          AIONUI_BUILD_PLATFORM: ${{ inputs.platform }}

  build-pipeline:
    needs: prepare-matrix
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      officecli_release_info: ${{ needs.prepare-matrix.outputs.release_info }}
      ref: ${{ needs.prepare-matrix.outputs.build_ref }}
      skip_code_quality: ${{ inputs.skip_code_quality }}
      aioncore_run_id: ${{ inputs.aioncore_run_id }}
      append_commit_hash: true
      upload_installers_only: true
    secrets: inherit
